name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            services/graph-detector/requirements.txt
            services/ebpf-detector/requirements.txt

      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r services/graph-detector/requirements.txt
          python -m pip install -r services/ebpf-detector/requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Evaluate independent synthetic validation and test splits
        run: python scripts/evaluate_financial.py --output reports/financial-evaluation.json

      - name: Save synthetic evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: financial-evaluation
          path: reports/financial-evaluation.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Test frontend
        run: pnpm --dir frontend test

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Build the integrated container stack
        run: docker compose build

      - name: Start the integrated container stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: Verify real service integration
        run: |
          python -m backend.app.integration_check
          python scripts/check_integrated_stack.py --state-file "$RUNNER_TEMP/argus-smoke.json"
          python scripts/check_dashboard_proxy.py

      - name: Verify persistence after backend restart
        run: |
          docker compose restart argus-backend
          docker compose up -d --wait --wait-timeout 120
          python scripts/check_integrated_stack.py --state-file "$RUNNER_TEMP/argus-smoke.json" --check-persistence

      - name: Verify graph detector outage handling
        run: |
          docker compose stop graph-detector
          python scripts/check_integrated_stack.py --check-detector-failure

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=150

      - name: Stop containers
        if: always()
        run: docker compose down
