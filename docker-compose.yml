services:
  argus-backend:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >-
      sh -c "pip install -r backend/requirements.txt &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

# Graph and eBPF services will be added when their implementations exist.
# Live eBPF requires Linux-specific privileges and is not a portable Docker
# dependency for the final demo.
