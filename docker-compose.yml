services:
  graph-detector:
    build:
      context: .
      dockerfile: services/graph-detector/Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ebpf-detector:
    build:
      context: .
      dockerfile: services/ebpf-detector/Dockerfile
    environment:
      ARGUS_EBPF_MODE: replay
    ports:
      - "8002:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  argus-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ARGUS_DETECTOR_MODE: ${ARGUS_DETECTOR_MODE:-required}
      GRAPH_DETECTOR_URL: http://graph-detector:8001
      EBPF_DETECTOR_URL: http://ebpf-detector:8002
      DETECTOR_TIMEOUT_SECONDS: ${DETECTOR_TIMEOUT_SECONDS:-5}
      ARGUS_DB_PATH: /workspace/runtime/argus.db
    volumes:
      - argus-runtime:/workspace/runtime
    depends_on:
      graph-detector:
        condition: service_healthy
      ebpf-detector:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      argus-backend:
        condition: service_healthy
    ports:
      - "5173:80"

# Live eBPF collection requires Linux-specific privileges. The full Compose
# demo therefore uses deterministic, sanitized replay telemetry; run the eBPF
# service directly on a Linux host to demonstrate live collection.

volumes:
  argus-runtime:
